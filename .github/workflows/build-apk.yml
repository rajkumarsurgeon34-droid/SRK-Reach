name: Build SRK Reach APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set)

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets \
            --iconBackgroundColor '#0f1115' --iconBackgroundColorDark '#0f1115' \
            --splashBackgroundColor '#0f1115' --splashBackgroundColorDark '#0f1115'
          npx cap sync android

      - name: Use the fixed signing key (so updates install over the old app)
        run: node scripts/signing.js

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SRK-Reach.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRK-Reach
          path: SRK-Reach.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SRK Reach v1.0.${{ github.run_number }}
          body: |
            **SRK-Reach.apk** — search and read Web, YouTube, Reddit, GitHub, X and RSS from one box, with AI summaries.

            Open the APK on your Android phone to install or update.
            (Allow "Install unknown apps" for your browser/Files app if asked.)
          files: SRK-Reach.apk
          make_latest: true
